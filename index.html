</style><main><h1>PY’s Wallet <small>3.0</small></h1><section id="view"></section></main><nav id="nav"></nav><script>
const key='pywallet2';const defaults=['TNG eWallet','Maybank','CIMB','Public Bank','RHB','Cash','Hong Leong Bank','GrabPay','Credit Card','AmBank','Other'];let db;try{db=JSON.parse(localStorage.getItem(key))}catch{};db=db||{accounts:defaults.map((name,i)=>({id:'a'+i,name,opening:0})),tx:[],budget:0,categories:['Food & drinks','Shopping','Transport','Bills','Health','Education','Entertainment','Salary','Other']};let tab=0,edit=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'RM '+(n/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},uid=()=>crypto.randomUUID(),save=()=>localStorage.setItem(key,JSON.stringify(db)),name=id=>db.accounts.find(a=>a.id===id)?.name||'Unknown',bal=a=>a.opening+db.tx.reduce((s,t)=>s+(t.account===a.id?(t.type==='income'?t.amount:-t.amount):0)+(t.type==='transfer'&&t.to===a.id?t.amount:0),0);let month=today().slice(0,7);function totals(){let ts=db.tx.filter(t=>t.date.startsWith(month));return {income:ts.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expense:ts.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),ts}}function go(i){tab=i;edit=null;render();window.scrollTo(0,0)}function rows(ts){return ts.length?ts.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="row"><div><b>${esc(t.note||t.category||'Transfer')}</b><br><small>${esc(t.date)} · ${esc(name(t.account))}${t.type==='transfer'?' → '+esc(name(t.to)):''}</small></div><div style="text-align:right"><b class="${t.type==='income'?'positive':''}">${t.type==='income'?'+':t.type==='expense'?'−':''}${money(t.amount)}</b><br><button data-edit="${esc(t.id)}">Edit</button></div></div>`).join(''):'<p class="muted">No transactions yet.</p>'}function options(items,selected){return items.map(([v,n])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(n)}</option>`).join('')}function render(){let {income,expense,ts}=totals();$('nav').innerHTML=['Home','Accounts','Add','Insights','More'].map((n,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})"><b>${['⌂','▤','⊕','◴','☷'][i]}</b>${n}</button>`).join('');let v=$('view');if(tab===0)v.innerHTML=`<div class="card hero"><small>Total balance</small><div class="amount">${money(db.accounts.reduce((s,a)=>s+bal(a),0))}</div><div class="split"><div><small>Income this month</small><br>${money(income)}</div><div><small>Expenses this month</small><br>${money(expense)}</div></div></div><div class="card"><b>Monthly budget</b><p>${money(expense)} / ${db.budget?money(db.budget):'Not set'}</p><progress max="${db.budget||1}" value="${expense}"></progress><p><button onclick="go(4)">Manage budget</button></p></div><h2>Recent transactions</h2><div class="card">${rows(db.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`;if(tab===1)v.innerHTML=`<h2>My accounts</h2><div class="card">${db.accounts.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><br><small>${money(bal(a))}</small></div><button data-account="${esc(a.id)}">Edit</button></div>`).join('')}</div><form id="accountForm" class="card"><h2>Add account</h2><label>Name<input required name="name"></label><label>Opening balance (RM)<input name="opening" type="number" step="0.01" value="0" required></label><button>Add account</button></form>`;if(tab===2){let t=db.tx.find(t=>t.id===edit)||{};v.innerHTML=`<form id="txForm" class="card"><h2>${edit?'Edit':'New'} transaction</h2><label>Type<select name="type" id="type">${options([['expense','Expense'],['income','Income'],['transfer','Transfer']],t.type||'expense')}</select></label><label>Amount (RM)<input name="amount" type="number" min="0.01" step="0.01" required value="${t.amount?t.amount/100:''}" placeholder="0.00"></label><label>Account<select name="account">${options(db.accounts.map(a=>[a.id,a.name]),t.account)}</select></label><div id="destination"><label>Destination<select name="to">${options(db.accounts.map(a=>[a.id,a.name]),t.to)}</select></label></div><div id="category"><label>Category<select name="category">${options(db.categories.map(c=>[c,c]),t.category)}</select></label></div><label>Date<input type="date" name="date" required value="${esc(t.date||today())}"></label><label>Merchant / note<input name="note" value="${esc(t.note)}"></label><button class="full">Save transaction</button>${edit?'<p><button type="button" id="deleteTx">Delete transaction</button></p>':''}</form><div class="card"><h2>Import recognized text</h2><small>Paste text copied from iPhone Live Text. Review the suggested amount before saving.</small><textarea id="ocr" style="width:100%;min-height:80px;margin:12px 0" placeholder="Paste payment text"></textarea><button id="parse">Fill transaction</button></div>`;let toggle=()=>{$('destination').hidden=$('type').value!=='transfer';$('category').hidden=$('type').value==='transfer'};$('type').onchange=toggle;toggle();$('parse').onclick=()=>{let s=$('ocr').value,m=s.match(/(?:RM|MYR)\s*([\d,]+\.\d{2})/i);if(m)$('txForm').elements.amount.value=m[1].replaceAll(',','');else alert('No RM amount found. Enter it manually.');$('txForm').elements.note.value=s.split('\n').filter(Boolean)[0]||''};if(edit)$('deleteTx').onclick=()=>{if(confirm('Delete this transaction?')){db.tx=db.tx.filter(t=>t.id!==edit);save();go(0)}}}if(tab===3){let cats={};ts.filter(t=>t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);v.innerHTML=`<h2>Spending insights</h2><input id="month" type="month" value="${month}"><div class="card"><div class="amount">${money(expense)}</div><small>Expenses · ${month}</small>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="row"><span>${esc(c)}</span><b>${money(n)}</b></div><progress max="${expense||1}" value="${n}"></progress>`).join('')}</div><div class="card"><b>Net income</b><p>${money(income-expense)}</p></div><div class="card">${rows(ts)}</div>`;$('month').onchange=e=>{month=e.target.value||today().slice(0,7);render()}}if(tab===4)v.innerHTML=`<div class="card"><h2>Monthly budget</h2><form id="budgetForm"><input name="budget" type="number" min="0" step="0.01" required value="${db.budget/100}"><button>Save budget</button></form></div><div class="card"><h2>Categories</h2><p>${db.categories.map(esc).join(' · ')}</p><form id="catForm"><input name="category" required placeholder="New category"><button>Add category</button></form></div><div class="card"><h2>Backup & restore</h2><p>Records are stored on this device. Export backups regularly.</p><button id="export">Export JSON</button><p><label>Restore version 2 backup<input id="import" type="file" accept=".json,application/json"></label></p><small>Older wallet backups are not yet supported.</small></div>`;wire()}
function wire(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=b.dataset.edit;tab=2;render()});document.querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>{let a=db.accounts.find(a=>a.id===b.dataset.account),n=prompt('Account name',a.name);if(!n?.trim())return;let o=prompt('Opening balance (RM)',a.opening/100);if(o===null||!Number.isFinite(Number(o)))return;a.name=n.trim();a.opening=Math.round(Number(o)*100);save();render()});for(let [id,fn] of Object.entries({accountForm:f=>{db.accounts.push({id:uid(),name:f.get('name').trim(),opening:Math.round(Number(f.get('opening'))*100)});save();render()},txForm:f=>{let t=Object.fromEntries(f);if(t.type==='transfer'&&t.account===t.to)return alert('Choose different accounts');t.amount=Math.round(Number(t.amount)*100);t.id=edit||uid();db.tx=db.tx.filter(x=>x.id!==t.id);db.tx.push(t);save();go(0)},budgetForm:f=>{db.budget=Math.round(Number(f.get('budget'))*100);save();render()},catForm:f=>{let c=f.get('category').trim();if(c&&!db.categories.includes(c))db.categories.push(c);save();render()}})){if($(id))$(id).onsubmit=e=>{e.preventDefault();fn(new FormData(e.target))}}if($('export'))$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='PY-Wallet-2-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('import'))$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.accounts)||!d.accounts.length||!d.accounts.every(a=>typeof a.id==='string'&&typeof a.name==='string'&&Number.isSafeInteger(a.opening))||!Array.isArray(d.tx)||!d.tx.every(t=>typeof t.id==='string'&&['expense','income','transfer'].includes(t.type)&&Number.isSafeInteger(t.amount)&&t.amount>0&&typeof t.date==='string'&&d.accounts.some(a=>a.id===t.account)&&(t.type!=='transfer'||d.accounts.some(a=>a.id===t.to)))||!Array.isArray(d.categories)||!d.categories.every(c=>typeof c==='string')||!Number.isSafeInteger(d.budget))throw Error();if(confirm('Replace all current version 2 records with this backup?')){db=d;save();render()}}catch{alert('Invalid version 2 backup. No changes made.')}}}
const baseRender=render, baseRows=rows;let query='',filter='all',insight='expense',panel='',hideBalance=false;db.goals??=[];db.albums??=[];db.plans??=[];db.items??=[];db.claims??=[];db.hourly??=0;db.categories=[...new Set([...db.categories,'Groceries','Travel','Fuel'])];
const icons={'Food & drinks':'🍱',Groceries:'🧺',Shopping:'🛍️',Transport:'🚗',Bills:'🧾',Health:'🌿',Education:'📚',Entertainment:'🎬',Salary:'💵',Travel:'🧳',Fuel:'⛽',Other:'🪙'};const ico=c=>icons[c]||'🪙';const acct=a=>/credit/i.test(a)?'💳':/wallet|grab/i.test(a)?'👛':/cash/i.test(a)?'💵':'🏦';const tile=(i,n,action)=>`<button class="tile" onclick="${action}"><span>${i}</span>${n}</button>`;function shift(n){let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+n);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}function monthbar(){return `<div class="monthbar"><button onclick="shift(-1)">‹</button><b>${new Date(month+'-01T12:00:00').toLocaleDateString('en',{month:'long',year:'numeric'})}</b><button onclick="shift(1)">›</button></div>`}function journal(ts){let groups={};ts.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>(groups[t.date]??=[]).push(t));return Object.entries(groups).map(([d,arr])=>`<div class="day"><span>${esc(d)} · ${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}</span><span class="danger">${money(arr.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0))}</span></div>`+arr.map(t=>`<div class="journal" data-edit="${esc(t.id)}" role="button" tabindex="0"><span class="emoji">${ico(t.category)}</span><div class="desc"><b>${esc(t.note||t.category||'Transfer')}</b><small>${esc(t.category||t.type)}</small><span class="pill">${acct(name(t.account))} ${esc(name(t.account))}</span></div><b class="${t.type==='income'?'positive':'danger'}">${t.type==='income'?'+':''}${money(t.amount)}</b></div>`).join('')).join('')||'<div class="card" style="text-align:center;padding:35px"><div style="font-size:48px">👛</div><h2>No transactions yet</h2><small>Tap + to start your journal.</small></div>'}function sheet(html){closeSheet();let el=document.createElement('div');el.id='sheet';el.className='sheet';el.innerHTML=`<div><button style="float:right" onclick="closeSheet()">✕</button>${html}</div>`;el.onclick=e=>{if(e.target===el)closeSheet()};document.body.append(el)}function closeSheet(){$('sheet')?.remove()}function addMenu(split=false){sheet(`<h2><button onclick="addMenu(false)">Add</button> <button onclick="addMenu(true)">Split</button></h2><div class="tilegrid" style="grid-template-columns:1fr 1fr">${split?tile('🧩','Manual split','splitBill()'):tile('🔢','Quick entry','entry(true)')+tile('✏️','Full entry','entry(false)')+tile('🧾','Receipt text','entry(false,true)')+tile('🔄','Transfer','entry(false,false,true)')}</div>`)}function entry(quick=false,ocr=false,transfer=false){closeSheet();go(2);if(transfer){$('type').value='transfer';$('type').onchange()}if(quick)$('txForm').elements.amount.focus();if(ocr)$('ocr').focus()}function splitBill(){sheet(`<h2>Split a bill</h2><label>Total (RM)<input id="splitTotal" type="number" min="0" step=".01"></label><label>People including you<input id="splitPeople" type="number" min="1" step="1" value="2"></label><button onclick="let a=Number($('splitTotal').value),b=Number($('splitPeople').value);if(a>0&&Number.isInteger(b)&&b>0){$('splitResult').textContent='Your share: '+money(Math.round(a*100/b))+' · Others: '+money(Math.round(a*100)-Math.round(a*100/b))}">Calculate</button><p id="splitResult"></p>`)}function openPanel(p){panel=p;tab=4;render()}function collection(k,title){let arr=db[k];return `<h2>${title}</h2><form id="collectionForm" class="card"><label>Name<input name="name" required></label><label>Amount / target (RM)<input name="amount" type="number" min="0" step=".01" required></label><button>Add</button></form>${arr.map((a,i)=>`<div class="card row"><div><b>${esc(a.name)}</b><br>${money(a.amount)}</div><button onclick="removeItem('${k}',${i})">Remove</button></div>`).join('')}`}function removeItem(k,i){if(confirm('Remove this item?')){db[k].splice(i,1);save();render()}}function csv(){let q=v=>'"'+String(v??'').replaceAll('"','""')+'"';let data=[['Date','Type','Amount MYR','Account','Category','Note'],...db.tx.map(t=>[t.date,t.type,t.amount/100,name(t.account),t.category,t.note])].map(r=>r.map(q).join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='wallet.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
render=function(){baseRender();let v=$('view'),{income,expense,ts}=totals();$('nav').innerHTML=['Home','Accounts','Insights','Albums','Settings'].map((n,i)=>`<button class="${tab===[0,1,3,5,4][i]?'active':''}" onclick="panel='';go(${[0,1,3,5,4][i]})"><b>${['🏠','👛','📊','🗂️','⚙️'][i]}</b>${n}</button>`).join('');$('fab')?.remove();if(tab===0){v.innerHTML=monthbar()+`<div class="summary"><div><small>↙ INCOME</small><b class="positive">${money(income)}</b></div><div><small>↗ EXPENSE</small><b class="danger">${money(expense)}</b></div></div><input id="search" placeholder="Search transactions" value="${esc(query)}"><select id="filter">${options([['all','All transactions'],['expense','Expenses'],['income','Income'],['transfer','Transfers']],filter)}</select><div id="journal"></div>`;let refresh=()=>{$('journal').innerHTML=journal(ts.filter(t=>(filter==='all'||t.type===filter)&&[t.note,t.category,name(t.account)].join(' ').toLowerCase().includes(query.toLowerCase())));wire()};$('search').oninput=e=>{query=e.target.value;refresh()};$('filter').onchange=e=>{filter=e.target.value;refresh()};refresh();let b=document.createElement('button');b.id='fab';b.className='fab';b.textContent='+';b.onclick=()=>addMenu();document.body.append(b)}if(tab===1){let assets=db.accounts.reduce((s,a)=>s+Math.max(0,bal(a)),0),debt=db.accounts.reduce((s,a)=>s+Math.max(0,-bal(a)),0);let form=$('accountForm').outerHTML;v.innerHTML=`<div class="row"><h2>Accounts</h2><button onclick="hideBalance=!hideBalance;render()">${hideBalance?'Show':'Hide'} balances</button></div><div class="card hero"><small>NET ASSETS</small><div class="amount">${hideBalance?'••••':money(assets-debt)}</div><div class="split"><div>Assets<br>${hideBalance?'••••':money(assets)}</div><div>Debt<br>${hideBalance?'••••':money(debt)}</div></div></div>`+['Cash & eWallets','Bank accounts','Credit cards'].map((g,i)=>`<h2>${g}</h2>`+db.accounts.filter(a=>acct(a.name)===(i===2?'💳':i===1?'🏦':'👛')||(i===0&&acct(a.name)==='💵')).map(a=>`<div class="accountcard row" data-account="${esc(a.id)}"><b>${acct(a.name)} ${esc(a.name)}</b><b>${hideBalance?'••••':money(bal(a))}</b></div>`).join('')).join('')+form;wire()}if(tab===3){let sum=insight==='income'?income:expense,cats={};ts.filter(t=>t.type===insight).forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);let colors=['#a27bc9','#d6b9e9','#83b5a0','#df9eae','#e9c78c'],at=0;let stops=Object.values(cats).map((n,i)=>{let start=at;at+=n/(sum||1)*100;return `${colors[i%5]} ${start}% ${at}%`});v.innerHTML='<h2>Breakdown</h2>'+monthbar()+`<div class="split"><button onclick="insight='expense';render()">Expense</button><button onclick="insight='income';render()">Income</button></div><div class="donut" style="background:${stops.length?'conic-gradient('+stops.join(',')+')':'#e4d8ef'}"><span>${money(sum)}</span></div>`+Object.entries(cats).map(([c,n],i)=>`<div class="card row"><b>${ico(c)} ${esc(c)}</b><span>${money(n)} · ${(n/sum*100).toFixed(1)}%</span></div>`).join('')+`<div class="card">Net income: ${money(income-expense)}${db.hourly>0?'<p>Expense in working hours: '+(expense/100/db.hourly).toFixed(1)+' h</p>':''}</div>`}if(tab===5){v.innerHTML=collection('albums','Albums');bindCollection('albums')}if(tab===4){let old=v.innerHTML;if(!panel){v.innerHTML=`<h2>Settings</h2><div class="card hero"><b>💜 My Wallet</b><p>${db.tx.length} transactions · Local storage</p><small>No subscription</small></div><h2>Preferences</h2><div class="tilegrid">${tile('🎨','Display',"openPanel('display')")}${tile('🕰️','Hourly value',"openPanel('hourly')")}${tile('📂','Categories',"openPanel('core')")}</div><h2>Money</h2><div class="tilegrid">${tile('🐷','Budget',"openPanel('core')")}${tile('🎯','Goals',"openPanel('goals')")}${tile('📦','Items',"openPanel('items')")}${tile('📅','Payment plans',"openPanel('plans')")}${tile('🧩','Split bill','splitBill()')}${tile('💰','Claim back',"openPanel('claims')")}</div><h2>Data</h2><div class="tilegrid">${tile('💾','Backup',"openPanel('core')")}${tile('📑','CSV export','csv()')}${tile('📲','Shortcuts',"openPanel('shortcut')")}</div>`}else{let back='<button onclick="panel=\'\';render()">‹ Settings</button>';if(panel==='core'){v.innerHTML=back+old;wire()}else if(['goals','items','plans','claims'].includes(panel)){v.innerHTML=back+collection(panel,{goals:'Savings goals',items:'Purchased items',plans:'Payment plans (manual)',claims:'Claim back (manual)'}[panel]);bindCollection(panel)}else if(panel==='hourly'){v.innerHTML=back+`<h2>Hourly value</h2><input id="hourly" type="number" min="0" step=".01" value="${db.hourly}"><button onclick="db.hourly=Math.max(0,Number($('hourly').value)||0);save();render()">Save RM per hour</button>`}else if(panel==='display'){v.innerHTML=back+'<h2>Display</h2><p>Lavender theme follows your iPhone light or dark appearance.</p>'}else{v.innerHTML=back+'<h2>Shortcuts</h2><p>Use Take Screenshot → Extract Text from Image → Copy to Clipboard. Open Wallet and choose Receipt text. Paste and review before saving. Assign the shortcut in Settings → Accessibility → Touch → Back Tap.</p>'}}}};function bindCollection(k){$('collectionForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db[k].push({name:f.get('name'),amount:Math.round(Number(f.get('amount'))*100)});save();render()}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

}function options(items,selected){return items.map(([v,n])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(n)}</option>`).join('')}function render(){let {income,expense,ts}=totals();$('nav').innerHTML=['Home','Accounts','Add','Insights','More'].map((n,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})"><b>${['⌂','▤','⊕','◴','☷'][i]}</b>${n}</button>`).join('');let v=$('view');if(tab===0)v.innerHTML=`<div class="card hero"><small>Total balance</small><div class="amount">${money(db.accounts.reduce((s,a)=>s+bal(a),0))}</div><div class="split"><div><small>Income this month</small><br>${money(income)}</div><div><small>Expenses this month</small><br>${money(expense)}</div></div></div><div class="card"><b>Monthly budget</b><p>${money(expense)} / ${db.budget?money(db.budget):'Not set'}</p><progress max="${db.budget||1}" value="${expense}"></progress><p><button onclick="go(4)">Manage budget</button></p></div><h2>Recent transactions</h2><div class="card">${rows(db.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`;if(tab===1)v.innerHTML=`<h2>My accounts</h2><div class="card">${db.accounts.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><br><small>${money(bal(a))}</small></div><button data-account="${esc(a.id)}">Edit</button></div>`).join('')}</div><form id="accountForm" class="card"><h2>Add account</h2><label>Name<input required name="name"></label><label>Opening balance (RM)<input name="opening" type="number" step="0.01" value="0" required></label><button>Add account</button></form>`;if(tab===2){let t=db.tx.find(t=>t.id===edit)||{};v.innerHTML=`<form id="txForm" class="card"><h2>${edit?'Edit':'New'} transaction</h2><label>Type<select name="type" id="type">${options([['expense','Expense'],['income','Income'],['transfer','Transfer']],t.type||'expense')}</select></label><label>Amount (RM)<input name="amount" type="number" min="0.01" step="0.01" required value="${t.amount?t.amount/100:''}" placeholder="0.00"></label><label>Acco function wire(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=b.dataset.edit;tab=2;render()});document.querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>{let a=db.accounts.find(a=>a.id===b.dataset.account),n=prompt('Account name',a.name);if(!n?.trim())return;let o=prompt('Opening balance ('+currency319(a)+')',a.nativeOpening?.units??a.opening/100/(a.fx?.bookRate||a.fx?.rate||1));if(o===null||!Number.isFinite(Number(o)))return;a.name=n.trim();a.nativeOpening={currency:currency319(a),units:Number(o)};a.opening=Math.round(Number(o)*(a.fx?.bookRate||a.fx?.rate||1)*100);save();render()});for(let [id,fn] of Object.entries({accountForm:f=>{db.accounts.push({id:uid(),name:f.get('name').trim(),opening:Math.round(Number(f.get('opening'))*100)});save();render()},txForm:f=>{let t=Object.fromEntries(f);if(t.type==='transfer'&&t.account===t.to)return alert('Choose different accounts');t.amount=Math.round(Number(t.amount)*100);if(t.foreignCurrency){t.foreignAmount=Number(t.foreignAmount);t.foreignRate=Number(t.foreignRate)}if(t.type==='transfer'&&t.sourceLeg&&t.destinationLeg){try{t.sourceLeg=JSON.parse(t.sourceLeg);t.destinationLeg=JSON.parse(t.destinationLeg)}catch{return alert('Invalid transfer details')}}t.id=edit||uid();db.tx=db.tx.filter(x=>x.id!==t.id);db.tx.push(t);save();go(0)},budgetForm:f=>{db.budget=Math.round(Number(f.get('budget'))*100);save();render()},catForm:f=>{let c=f.get('category').trim();if(c&&!db.categories.includes(c))db.categories.push(c);save();render()}})){if($(id))$(id).onsubmit=e=>{e.preventDefault();fn(new FormData(e.target))}}if($('export'))$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='PY-Wallet-2-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('import'))$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.accounts)||!d. function reconcile317(base,local,remote){
 const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b), conflicts=[];

 let result={};for(const k of new Set([...Object.keys(base),...Object.keys(local),...Object.keys(remote)])){
 if(k==='pin36')continue;
 let b=base[k],l=local[k],r=remote[k];
 if(['tx','accounts'].includes(k)&&[b,l,r].every(Array.isArray)){
 let maps=[b,l,r].map(a=>new Map(a.map(x=>[x.id,x])));result[k]=[];
 for(let id of new Set(maps.flatMap(m=>[...m.keys()]))){let v=pick(...maps.map(m=>m.get(id)),k+': '+id);if(v!==undefined)result[k].push(v);}
 }else{let v=pick(b,l,r,k);if(v!==undefined)result[k]=v;}}
 return {result,conflicts};
}

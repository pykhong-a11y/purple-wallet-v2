function parseCSV(s){let rows=[],row=[],field='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('Unclosed quote');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
let pendingCSV=[];function statementPanel(){return `<h2>Statement import</h2><p>CSV only. Required columns: Date, Type, Amount MYR, Account, Category, Note. Dates YYYY-MM-DD; Type income or expense. Account names must match your wallet. Transfers are not imported.</p><input id="statementFile" type="file" accept=".csv,text/csv"><div id="statementPreview"></div>`}

 if(k==='pin36')continue;

 if(['tx','accounts'].includes(k)&&[b,l,r].every(Array.isArray)){

function drawSplit400(){let d=split400,a=shares400(),total=a.reduce((x,y)=>x+y,0),raw=d.mode==='items'?d.items.reduce((x,y)=>x+y.amount,0):d.amounts.reduce((x,y)=>x+y,0);let h=`<div class="split400"><div class="page400"><button onclick="backSplit400()">‹</button><h2>${d.mode==='items'?'Split by item':'Split bill'}</h2></div><div class="steps400">${[0,1,2].map(i=>`<i class="${i<=d.step?'on':''}"></i>`).join('')}</div><div class="total400"><small>Total</small>${money(Math.round(raw*(1+d.tax/100)))}</div>`;if(d.step===0){if(d.mode==='manual')h+=`<div class="card">${d.people.map((p,i)=>`<div class="row"><input aria-label="Person" value="${esc(p)}" onchange="split400.people[${i}]=this.value"><input aria-label="Amount" type="number" min="0" step=".01" value="${(d.amounts[i]||0)/100}" onchange="split400.amounts[${i}]=cents400(this.value);drawSplit400()"></div>`).join('')}<button class="wide400" onclick="addPerson400()">+ Add person</button></div>`;else h+=`<div class="card">${d.items.map((x,i)=>`<div class="row"><input aria-label="Item" value="${esc(x.name)}" onchange="split400.items[${i}].name=this.value"><input aria-label="Price" type="number" min="0" step=".01" value="${x.amount/100}" onchange="split400.items[${i}].amount=cents400(this.value);drawSplit400()"><button onclick="split400.items.splice(${i},1);drawSplit400()">×</button></div>`).join('')}<button class="wide400" onclick="split400.items.push({name:'Item',amount:0,owner:-1});drawSplit400()">+ Add item</button><details><summary>Paste receipt text</summary><textarea id="receipt400" placeholder="One item per line, ending in price"></textarea><button onclick="parseItems400()">Review extracted items</button></details></div>`;h+=`<div class="card"><label>Tax & service (%)<input type="number" min="0" max="100" value="${d.tax}" onchange="split400.tax=Math.max(0,Math.min(100,Number(this.value)||0));drawSplit400()"></label></div><button class="wide400" onclick="nextSplit400()">Next</button>`}else if(d.step===1&&d.mode==='items'){h+=`<div class="card"><div class="row"><b>People</b><button onclick="addPerson400()">+ Add</button></div><div class="person400">${d.people.map((p,i)=>`<button class="${d.selected===i?'chosen':''}" onclick="split400.selected=${i};drawSplit400()">${esc(p)} · ${money(a[i])}</button>`).join('')}</div><input value="${esc(d.people[d.selected])}" onchange="split400.people[split400.selected]=this.value;drawSplit400()"></div><p>Select a person, then tap their items.</p>${d.items.map((x,i)=>`<button class="item400" onclick="split400.items[${i}].owner=split400.selected;drawSplit400()">${esc(x.name)}<small>${money(x.amount)} · ${x.owner<0?'Unassigned':esc(d.people[x.owner])}</small></button>`).join('')}<button class="wide400" onclick="split400.items.forEach(x=>{if(x.owner<0)x.owner=0});drawSplit400()">Assign rest to me</button><button class="wide400" onclick="nextSplit400()">Next</button>`}else{h+=`<div class="card">${d.people.map((p,i)=>`<div class="row"><b>${esc(p)}</b><b>${money(a[i])}</b></div>${d.mode==='items'?d.items.filter(x=>x.owner===i).map(x=>`<small>${esc(x.name)} · ${money(x.amount)}</small><br>`).join(''):''}`).join('')}</div><div class="card"><label>Note<input id="splitNote400" placeholder="Restaurant or occasion"></label><label>Paid by<select id="payer400">${options(d.people.map((p,i)=>[String(i),p]))}</select></label><label>Payment account (MYR)<select id="splitAccount402">${options(db.accounts.filter(a=>currency319(a)==='MYR'&&!a.splitReceivable).map(a=>[a.id,a.name]))}</select></label><label>Category<select id="splitCategory402">${options(db.categories.map(c=>[c,c]),'Food & drinks')}</select></label></div><button class="wide400" onclick="saveSplit400()">Save split record</button><small>If you paid, your share is an expense and other shares become receivables. Other payers are tracking only.</small>`}sheet(h+'</div>')}
function addPerson400(){let d=split400;d.people.push('Person '+String.fromCharCode(64+d.people.length));d.amounts.push(0);drawSplit400()}
function backSplit400(){if(split400.step===0)return splitBill();split400.step=split400.mode==='manual'?0:split400.step-1;drawSplit400()}
function nextSplit400(){let d=split400;if(d.step===0&&!(d.mode==='manual'?d.amounts.some(x=>x>0):d.items.length&&d.items.every(x=>x.amount>0)))return alert('Enter valid amounts first');if(d.step===1&&d.items.some(x=>x.owner<0))return alert('Assign all items first');d.step=d.mode==='manual'?2:d.step+1;drawSplit400()}
function parseItems400(){for(let line of $('receipt400').value.split(/\n/)){let m=line.trim().match(/^(.+?)\s+(?:RM\s*)?(\d+\.\d{2})$/i);if(m&&!/total|tax|change|cash|service/i.test(m[1]))split400.items.push({name:m[1],amount:cents400(m[2]),owner:-1})}drawSplit400()}
function splitPost402(x,account,category){
 const total=x.shares.reduce((a,b)=>a+b,0),own=x.shares[0],owed=total-own;
 if(x.payer!==0)return;
 let receivable=db.accounts.find(a=>a.splitReceivable===true);
 if(owed&&!receivable){receivable={id:uid(),name:'Split receivables',opening:0,splitReceivable:true};db.accounts.push(receivable)}
 x.ledger={account,category,receivable:receivable?.id,repayments:{}};
 const post=(type,amount,to,note)=>{if(amount>0)db.tx.push({id:uid(),type,amount,account,to,category,note,date:x.date,splitId:x.id})};
 post('expense',own,undefined,x.note);post('transfer',owed,receivable?.id,x.note+' · friends’ shares');
}
function saveSplit400(){let d=split400,shares=shares400(),payer=Number($('payer400').value),account=$('splitAccount402').value,category=$('splitCategory402').value;if(!shares.every(v=>Number.isSafeInteger(v)&&v>=0)||!shares.some(v=>v>0))return alert('Invalid amounts');if(payer===0&&!db.accounts.some(a=>a.id===account&&currency319(a)==='MYR'&&!a.splitReceivable))return alert('Choose a MYR payment account');let x={id:uid(),date:$('date403')?.value||today(),note:$('splitNote400').value||'Split bill',payer,people:d.people.slice(),shares,items:d.items.slice(),paid:[]};db.splits400??=[];splitPost402(x,account,category);db.splits400.push(x);save();closeSheet();openPanel('settle400')}
function settle400(){return `<h2>Settle Up</h2>${(db.splits400||[]).map((x,i)=>`<div class="card"><b>${esc(x.note)}</b><p>${esc(x.date)} · Paid by ${esc(x.people[x.payer])}</p><small>${x.ledger?'Ledger linked · Outstanding '+money(x.shares.reduce((s,v,j)=>s+(j!==x.payer&&!x.paid.includes(j)?v:0),0)):'Tracking only · No balance changes'}</small>${x.people.map((p,j)=>j===x.payer?'':`<div class="row"><span>${esc(p)}<br><small>${money(x.shares[j])}</small></span><button onclick="mark400(${i},${j})">${x.paid.includes(j)?'Paid · undo':'Mark paid'}</button></div>`).join('')}<button onclick="share400(${i})">Share receipt</button></div>`).join('')||'<div class="card">No split records yet.</div>'}<button onclick="splitBill()">New split</button>`}
function repay402(x,j,account){if(x.paid.includes(j)||j===x.payer)return false; if(x.ledger&&x.shares[j]>0){if(!db.accounts.some(a=>a.id===account&&currency319(a)==='MYR'&&!a.splitReceivable)||!db.accounts.some(a=>a.id===x.ledger.receivable))return false;let id=uid();db.tx.push({id,type:'transfer',amount:x.shares[j],account:x.ledger.receivable,to:account,date:today(),category:'Other',note:x.note+' · repayment from '+x.people[j],splitId:x.id});x.ledger.repayments[j]=id}x.paid.push(j);return true}
function undo402(x,j){let id=x.ledger?.repayments[j];if(id){db.tx=db.tx.filter(t=>t.id!==id);delete x.ledger.repayments[j]}x.paid=x.paid.filter(v=>v!==j)}
function mark400(i,j){let x=db.splits400[i];if(x.paid.includes(j)){if(!confirm('Undo this repayment?'))return;undo402(x,j);save();render();return}if(!x.ledger||!x.shares[j]){repay402(x,j);save();render();return}sheet(`<h2>Record repayment</h2><p>${esc(x.people[j])} · ${money(x.shares[j])}</p><label>Received in<select id="repayAccount402">${options(db.accounts.filter(a=>currency319(a)==='MYR'&&!a.splitReceivable).map(a=>[a.id,a.name]),x.ledger.account)}</select></label><button onclick="confirmRepay402(${i},${j})">Confirm received</button>`)}
function confirmRepay402(i,j){if(!repay402(db.splits400[i],j,$('repayAccount402').value))return alert('Repayment already recorded or account unavailable');save();closeSheet();render()}
async function share400(i){let x=db.splits400[i],text='PY’s Wallet — '+x.note+'\n'+x.date+'\nPaid by '+x.people[x.payer]+'\n'+x.people.map((p,j)=>p+': '+money(x.shares[j])).join('\n');try{if(navigator.share)await navigator.share({text});else await navigator.clipboard.writeText(text)}catch{}}
function qr401(){return `<div class="card"><h3>Receipt preferences</h3><label>Payment QR (optional)<input type="file" accept="image/png,image/jpeg" onchange="loadQR401(this)"></label>${db.qr401?`<img src="${esc(db.qr401)}" style="width:120px;display:block"><button onclick="delete db.qr401;save();render()">Remove QR</button>`:''}<small>Stored in your wallet data, including backups. Only attach a QR you intend to share.</small></div>`}
function loadQR401(el){let f=el.files[0];if(!f||!['image/png','image/jpeg'].includes(f.type)||f.size>1000000)return alert('Choose a PNG or JPEG under 1 MB');let r=new FileReader();r.onload=()=>{db.qr401=r.result;save();render()};r.readAsDataURL(f)}
const settleBase401=settle400;settle400=function(){return settleBase401()+qr401()+(db.splits400||[]).map((x,i)=>`<div class="card"><b>${esc(x.note)}</b><button class="wide400" onclick="imageReceipt401(${i})">Share receipt image</button></div>`).join('')};
async function imageReceipt401(i){let x=db.splits400[i],lines=[];x.people.forEach((p,j)=>{if(j===x.payer)return;lines.push([p,money(x.shares[j])+(x.paid.includes(j)?' (paid)':'')]);(x.items||[]).filter(t=>t.owner===j).forEach(t=>lines.push(['  '+t.name,money(t.amount)]))});let c=document.createElement('canvas');c.width=1000;c.height=300+lines.length*55+(db.qr401?360:0);let g=c.getContext('2d');g.fillStyle='#F8F5EF';g.fillRect(0,0,c.width,c.height);g.fillStyle='#795592';g.font='bold 48px sans-serif';g.fillText('PY’s Wallet',50,75);g.fillStyle='#413B34';g.font='bold 36px sans-serif';g.fillText(x.note,50,145,900);g.font='28px sans-serif';g.fillText(x.date,50,195);let y=260;for(let [a,b] of lines){g.textAlign='left';g.fillText(a,50,y,610);g.textAlign='right';g.fillText(b,950,y,290);y+=55}if(db.qr401){let im=new Image();im.src=db.qr401;try{await im.decode();let scale=Math.min(300/im.width,300/im.height);g.drawImage(im,350+(300-im.width*scale)/2,y,im.width*scale,im.height*scale)}catch{alert('QR could not be loaded');return}}let blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)return;let file=new File([blob],'PYs-Wallet-receipt.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
const render400=render;render=function(){render400();let v=$('view');if(tab===4&&panel==='settle400')v.innerHTML='<button onclick="openPanel(\'\')">‹ Settings</button>'+settle400();if(tab===4&&!panel){let g=v.querySelector('.tilegrid');if(g)g.insertAdjacentHTML('beforeend',tile('🤝','Settle Up',"openPanel('settle400')"))}if(tab===4&&panel){let b=v.querySelector(':scope > button'),h=v.querySelector(':scope > h2');if(b&&h&&b.textContent.includes('Settings')){let head=document.createElement('div');head.className='page400';b.before(head);head.append(b,h);b.textContent='‹';b.setAttribute('aria-label','Back to Settings')}}};


function total403(){let d=split400;return Math.round((d.mode==='manual'?d.amounts:d.items.map(x=>x.amount)).reduce((a,b)=>a+b,0)*(1+d.tax/100))}
function update403(){let e=$('total403');if(e)e.textContent=money(total403());let b=$('next403');if(b)b.disabled=!total403()}
function remove403(i){let d=split400;d.people.splice(i,1);d.amounts.splice(i,1);d.items.forEach(x=>{if(x.owner===i)x.owner=-1;else if(x.owner>i)x.owner--});if(d.payer===i)d.payer=0;else if(d.payer>i)d.payer--;d.selected=0;drawSplit400()}
function singles403(i){let x=split400.items[i],n=Number(prompt('Quantity', '2'));if(!Number.isInteger(n)||n<2||n>100||n>x.amount)return;let q=Math.floor(x.amount/n);split400.items.splice(i,1,...Array.from({length:n},(_,j)=>({...x,amount:q+(j<x.amount%n?1:0)})));drawSplit400()}
function full403(h){sheet('<section class="full403">'+h+'</section>');$('sheet').classList.add('screen403')}
const oldDraw403=drawSplit400;
drawSplit400=function(){let d=split400;d.payer??=0;let head=`<header><button onclick="backSplit400()" aria-label="Back">‹</button><b>${d.mode==='manual'?'Split bill':'Split by item'}</b><button onclick="closeSheet()" aria-label="Close">×</button></header>${d.mode==='items'?`<div class="steps400">${[0,1,2].map(i=>`<i class="${i<=d.step?'on':''}"></i>`).join('')}</div>`:''}`;let h=head;
if(d.step===0){h+=`<div class="sum403"><small>${d.mode==='manual'?'Subtotal':'Total'}</small><strong id="total403">${money(total403())}</strong></div><div class="group403"><label class="line403">Paid by<select onchange="split400.payer=Number(this.value)">${options(d.people.map((p,i)=>[String(i),p]),String(d.payer))}</select></label></div>`;
if(d.mode==='manual'){h+=`<div class="group403">${d.people.map((p,i)=>`<div class="line403"><span class="avatar403">${esc(p[0]||'?')}</span><input aria-label="Name" value="${esc(p)}" onchange="split400.people[${i}]=this.value"><small>RM</small><input class="amount403" aria-label="Amount" inputmode="decimal" value="${d.amounts[i]? (d.amounts[i]/100).toFixed(2):''}" placeholder="0.00" oninput="split400.amounts[${i}]=cents400(this.value);update403()">${i?`<button onclick="remove403(${i})">×</button>`:''}</div>`).join('')}<button class="add403" onclick="addPerson400()">＋ Add person</button></div>`}else{h+=`<div class="group403">${d.items.length?'':'<p class="empty403">No items yet. Add an item or import receipt text.</p>'}${d.items.map((x,i)=>`<div class="line403"><input aria-label="Item" value="${esc(x.name)}" onchange="split400.items[${i}].name=this.value"><input class="amount403" inputmode="decimal" aria-label="Price" value="${x.amount?(x.amount/100).toFixed(2):''}" placeholder="0.00" oninput="split400.items[${i}].amount=cents400(this.value);update403()"><button onclick="split400.items.splice(${i},1);drawSplit400()">×</button></div><button class="sub403" onclick="singles403(${i})">Split into singles</button>`).join('')}<button class="add403" onclick="split400.items.push({name:'',amount:0,owner:-1});drawSplit400()">＋ Add item</button></div><details class="group403"><summary>Import receipt text</summary><p class="empty403">Use iPhone Live Text to copy receipt items, then paste below.</p><textarea id="receipt400" placeholder="Item name  12.00"></textarea><button class="add403" onclick="parseItems400()">Extract items</button></details>`}
h+=`<div class="group403"><small>Tax & service</small><div class="line403"><button onclick="split400.tax=Math.max(0,split400.tax-1);drawSplit400()">−</button><input class="amount403" type="number" min="0" max="100" value="${d.tax}" oninput="split400.tax=Math.max(0,Math.min(100,Number(this.value)||0));update403()"><span>%</span><button onclick="split400.tax=Math.min(100,split400.tax+1);drawSplit400()">＋</button></div></div><footer><button id="next403" ${total403()?'':'disabled'} onclick="nextSplit400()">Next</button></footer>`;full403(h);return}
oldDraw403();let el=$('sheet');el.classList.add('screen403');let inner=el.querySelector('.split400');if(inner){inner.classList.add('full403');let p=$('payer400');if(p)p.value=String(d.payer);let note=$('splitNote400');if(note)note.insertAdjacentHTML('afterend','<label>Date<input type="date" id="date403" value="'+today()+'"></label>')}};
render();if(db.pin36)lock36();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

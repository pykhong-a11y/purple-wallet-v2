<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7f3fc"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>PY’s Wallet</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3fc;color:#30243e;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:650px;margin:auto;padding: max(20px,env(safe-area-inset-top)) 18px 110px}h1{font-size:25px}h2{font-size:19px}small{color:#796b89}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px;background:#7951b5;color:white}input,select{width:100%;padding:13px;border:1px solid #ddd2ed;border-radius:12px;background:white;color:#30243e;margin:6px 0 13px}label{font-size:13px;font-weight:600}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 15px #593a8510}.hero{background:linear-gradient(125deg,#a27bd9,#69449f);color:white}.hero small{color:#eee4ff}.amount{font-size:32px;font-weight:700;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee8f5}.row:last-child{border:0}.row button{padding:7px;background:#eee5f9;color:#67439f}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:9px 0 max(12px,env(safe-area-inset-bottom));box-shadow:0 -2px 15px #593a8512}nav button{background:none;color:#8c7d9d;flex:1;max-width:130px;font-size:11px;padding:5px}nav b{display:block;font-size:23px;margin-bottom:4px}nav .active{color:#7146b0}progress{width:100%;accent-color:#7951b5}.muted{color:#796b89}.danger{color:#a13953} .positive{color:#207b60} .full{width:100%} .split{display:flex;gap:12px;justify-content:space-between}.split>*{flex:1} @media(prefers-color-scheme:dark){body{background:#20192b;color:#f1e9fc}.card,nav{background:#30243e}input,select{background:#3c2e4d;color:white;border-color:#59466b}.row{border-color:#493957}small,.muted{color:#c5b4d8}}
</style><main><h1>PY’s Wallet <small>2.0</small></h1><section id="view"></section></main><nav id="nav"></nav><script>
const key='pywallet2';const defaults=['TNG eWallet','Maybank','CIMB','Public Bank','RHB','Cash','Hong Leong Bank','GrabPay','Credit Card','AmBank','Other'];let db;try{db=JSON.parse(localStorage.getItem(key))}catch{};db=db||{accounts:defaults.map((name,i)=>({id:'a'+i,name,opening:0})),tx:[],budget:0,categories:['Food & drinks','Shopping','Transport','Bills','Health','Education','Entertainment','Salary','Other']};let tab=0,edit=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'RM '+(n/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},uid=()=>crypto.randomUUID(),save=()=>localStorage.setItem(key,JSON.stringify(db)),name=id=>db.accounts.find(a=>a.id===id)?.name||'Unknown',bal=a=>a.opening+db.tx.reduce((s,t)=>s+(t.account===a.id?(t.type==='income'?t.amount:-t.amount):0)+(t.type==='transfer'&&t.to===a.id?t.amount:0),0);let month=today().slice(0,7);function totals(){let ts=db.tx.filter(t=>t.date.startsWith(month));return {income:ts.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expense:ts.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),ts}}function go(i){tab=i;edit=null;render();window.scrollTo(0,0)}function rows(ts){return ts.length?ts.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="row"><div><b>${esc(t.note||t.category||'Transfer')}</b><br><small>${esc(t.date)} · ${esc(name(t.account))}${t.type==='transfer'?' → '+esc(name(t.to)):''}</small></div><div style="text-align:right"><b class="${t.type==='income'?'positive':''}">${t.type==='income'?'+':t.type==='expense'?'−':''}${money(t.amount)}</b><br><button data-edit="${esc(t.id)}">Edit</button></div></div>`).join(''):'<p class="muted">No transactions yet.</p>'}function options(items,selected){return items.map(([v,n])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(n)}</option>`).join('')}function render(){let {income,expense,ts}=totals();$('nav').innerHTML=['Home','Accounts','Add','Insights','More'].map((n,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})"><b>${['⌂','▤','⊕','◴','☷'][i]}</b>${n}</button>`).join('');let v=$('view');if(tab===0)v.innerHTML=`<div class="card hero"><small>Total balance</small><div class="amount">${money(db.accounts.reduce((s,a)=>s+bal(a),0))}</div><div class="split"><div><small>Income this month</small><br>${money(income)}</div><div><small>Expenses this month</small><br>${money(expense)}</div></div></div><div class="card"><b>Monthly budget</b><p>${money(expense)} / ${db.budget?money(db.budget):'Not set'}</p><progress max="${db.budget||1}" value="${expense}"></progress><p><button onclick="go(4)">Manage budget</button></p></div><h2>Recent transactions</h2><div class="card">${rows(db.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`;if(tab===1)v.innerHTML=`<h2>My accounts</h2><div class="card">${db.accounts.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><br><small>${money(bal(a))}</small></div><button data-account="${esc(a.id)}">Edit</button></div>`).join('')}</div><form id="accountForm" class="card"><h2>Add account</h2><label>Name<input required name="name"></label><label>Opening balance (RM)<input name="opening" type="number" step="0.01" value="0" required></label><button>Add account</button></form>`;if(tab===2){let t=db.tx.find(t=>t.id===edit)||{};v.innerHTML=`<form id="txForm" class="card"><h2>${edit?'Edit':'New'} transaction</h2><label>Type<select name="type" id="type">${options([['expense','Expense'],['income','Income'],['transfer','Transfer']],t.type||'expense')}</select></label><label>Amount (RM)<input name="amount" type="number" min="0.01" step="0.01" required value="${t.amount?t.amount/100:''}" placeholder="0.00"></label><label>Account<select name="account">${options(db.accounts.map(a=>[a.id,a.name]),t.account)}</select></label><div id="destination"><label>Destination<select name="to">${options(db.accounts.map(a=>[a.id,a.name]),t.to)}</select></label></div><div id="category"><label>Category<select name="category">${options(db.categories.map(c=>[c,c]),t.category)}</select></label></div><label>Date<input type="date" name="date" required value="${esc(t.date||today())}"></label><label>Merchant / note<input name="note" value="${esc(t.note)}"></label><button class="full">Save transaction</button>${edit?'<p><button type="button" id="deleteTx">Delete transaction</button></p>':''}</form><div class="card"><h2>Import recognized text</h2><small>Paste text copied from iPhone Live Text. Review the suggested amount before saving.</small><textarea id="ocr" style="width:100%;min-height:80px;margin:12px 0" placeholder="Paste payment text"></textarea><button id="parse">Fill transaction</button></div>`;let toggle=()=>{$('destination').hidden=$('type').value!=='transfer';$('category').hidden=$('type').value==='transfer'};$('type').onchange=toggle;toggle();$('parse').onclick=()=>{let s=$('ocr').value,m=s.match(/(?:RM|MYR)\s*([\d,]+\.\d{2})/i);if(m)$('txForm').elements.amount.value=m[1].replaceAll(',','');else alert('No RM amount found. Enter it manually.');$('txForm').elements.note.value=s.split('\n').filter(Boolean)[0]||''};if(edit)$('deleteTx').onclick=()=>{if(confirm('Delete this transaction?')){db.tx=db.tx.filter(t=>t.id!==edit);save();go(0)}}}if(tab===3){let cats={};ts.filter(t=>t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);v.innerHTML=`<h2>Spending insights</h2><input id="month" type="month" value="${month}"><div class="card"><div class="amount">${money(expense)}</div><small>Expenses · ${month}</small>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="row"><span>${esc(c)}</span><b>${money(n)}</b></div><progress max="${expense||1}" value="${n}"></progress>`).join('')}</div><div class="card"><b>Net income</b><p>${money(income-expense)}</p></div><div class="card">${rows(ts)}</div>`;$('month').onchange=e=>{month=e.target.value||today().slice(0,7);render()}}if(tab===4)v.innerHTML=`<div class="card"><h2>Monthly budget</h2><form id="budgetForm"><input name="budget" type="number" min="0" step="0.01" required value="${db.budget/100}"><button>Save budget</button></form></div><div class="card"><h2>Categories</h2><p>${db.categories.map(esc).join(' · ')}</p><form id="catForm"><input name="category" required placeholder="New category"><button>Add category</button></form></div><div class="card"><h2>Backup & restore</h2><p>Records are stored on this device. Export backups regularly.</p><button id="export">Export JSON</button><p><label>Restore version 2 backup<input id="import" type="file" accept=".json,application/json"></label></p><small>Older wallet backups are not yet supported.</small></div>`;wire()}
function wire(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=b.dataset.edit;tab=2;render()});document.querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>{let a=db.accounts.find(a=>a.id===b.dataset.account),n=prompt('Account name',a.name);if(!n?.trim())return;let o=prompt('Opening balance (RM)',a.opening/100);if(o===null||!Number.isFinite(Number(o)))return;a.name=n.trim();a.opening=Math.round(Number(o)*100);save();render()});for(let [id,fn] of Object.entries({accountForm:f=>{db.accounts.push({id:uid(),name:f.get('name').trim(),opening:Math.round(Number(f.get('opening'))*100)});save();render()},txForm:f=>{let t=Object.fromEntries(f);if(t.type==='transfer'&&t.account===t.to)return alert('Choose different accounts');t.amount=Math.round(Number(t.amount)*100);t.id=edit||uid();db.tx=db.tx.filter(x=>x.id!==t.id);db.tx.push(t);save();go(0)},budgetForm:f=>{db.budget=Math.round(Number(f.get('budget'))*100);save();render()},catForm:f=>{let c=f.get('category').trim();if(c&&!db.categories.includes(c))db.categories.push(c);save();render()}})){if($(id))$(id).onsubmit=e=>{e.preventDefault();fn(new FormData(e.target))}}if($('export'))$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='PY-Wallet-2-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('import'))$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.accounts)||!d.accounts.length||!d.accounts.every(a=>typeof a.id==='string'&&typeof a.name==='string'&&Number.isSafeInteger(a.opening))||!Array.isArray(d.tx)||!d.tx.every(t=>typeof t.id==='string'&&['expense','income','transfer'].includes(t.type)&&Number.isSafeInteger(t.amount)&&t.amount>0&&typeof t.date==='string'&&d.accounts.some(a=>a.id===t.account)&&(t.type!=='transfer'||d.accounts.some(a=>a.id===t.to)))||!Array.isArray(d.categories)||!d.categories.every(c=>typeof c==='string')||!Number.isSafeInteger(d.budget))throw Error();if(confirm('Replace all current version 2 records with this backup?')){db=d;save();render()}}catch{alert('Invalid version 2 backup. No changes made.')}}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
